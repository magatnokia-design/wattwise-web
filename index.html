<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10B981" />
    <meta name="description" content="WattWise measures what each of your two outlets draws, prices it on your real electricity tariff, and switches them off when a load passes a limit you set." />

    <!-- Open Graph, because the way this link actually travels is pasted into a
         chat thread. Without these a share renders as a bare URL with no title,
         no description and whatever image the scraper guesses at. The logo is
         the one the invoice emails already use, so the mark stays consistent. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WattWise" />
    <meta property="og:title" content="WattWise — know what every outlet costs you" />
    <meta property="og:description" content="Measure each outlet separately, price it on your real electricity tariff, and cut the power when a load passes your limit." />
    <meta property="og:url" content="https://www.wattwise.site/" />
    <meta property="og:image" content="https://www.wattwise.site/email-logo.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Real files, at real URLs, generated from the phone app's launcher icon
         by scripts/generate-icons.cjs so both surfaces carry the same mark.

         This was an inline `data:` SVG until 18 Aug 2026, which looked correct
         in every browser tab and was still wrong. Google's crawler does not read
         a data URI - it fetches /favicon.ico as an ordinary URL. This is a
         single-page app whose rewrite serves index.html for anything unmatched,
         so the crawler asked for the icon, received a page of HTML, and printed
         its own generic mark beside wattwise.site in the search results.

         Keep these as files. Any future "tidy-up" back into a data URI silently
         reintroduces exactly that bug, and it will not be visible in a browser. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>WattWise</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
