<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10B981" />
    <meta name="description" content="WattWise measures what each of your two outlets draws, prices it on your real electricity tariff, and switches them off when a load passes a limit you set." />

    <!-- Open Graph, because the way this link actually travels is pasted into a
         chat thread. Without these a share renders as a bare URL with no title,
         no description and whatever image the scraper guesses at. The logo is
         the one the invoice emails already use, so the mark stays consistent. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WattWise" />
    <meta property="og:title" content="WattWise — know what every outlet costs you" />
    <meta property="og:description" content="Measure each outlet separately, price it on your real electricity tariff, and cut the power when a load passes your limit." />
    <meta property="og:url" content="https://www.wattwise.site/" />
    <meta property="og:image" content="https://www.wattwise.site/email-logo.png" />
    <meta name="twitter:card" content="summary" />
    <!-- The real brand mark, not the ⚡ emoji this used to render: a white bolt
         on a #10B981 disc, from the source path in FROM-THE-PHONE-REPO.md §25.
         The disc is deliberate — a white bolt on transparent disappears against
         a light tab strip. Bolt height equals the circle's radius, matching the
         phone's circle lockup, and it stays legible down to 16px, which is the
         size a browser tab actually draws. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2750%27%20fill%3D%27%2310B981%27%2F%3E%3Cpath%20d%3D%27M17%200%20L0%2025%20L10%2025%20L8%2044%20L26%2018%20L15%2018%20Z%27%20fill%3D%27%23ffffff%27%20transform%3D%27translate(35.23%2C25)%20scale(1.1364)%27%2F%3E%3C%2Fsvg%3E" />
    <title>WattWise</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
