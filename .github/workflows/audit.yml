name: Dependency audit

# Runs on every push and once a week. The weekly run is the point: a repository
# with no commits is not a repository with no vulnerabilities, and most advisories
# land against code that has not changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 09:00 Manila, Mondays (01:00 UTC).
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # What ships: the production dependencies, which are what people load in
      # a browser. They report zero advisories at any level, so the gate sits
      # where it actually is rather than somewhere looser it could drift to.
      - name: Audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=moderate

      # Everything, developer tools included, still at moderate - but through
      # audit-gate.cjs, which excuses individual advisories BY ID from
      # audit-allowlist.json, each with its reason. Added 1 Nov 2026 for one:
      # a moderate minimatch advisory (GHSA-g3hv-75wg-m249) reached only through
      # eslint 9, which failed every push with npm's only "fix" a downgrade to
      # eslint 4. Any other advisory fails exactly as plain npm audit would, and
      # the gate warns once the excuse stops matching so it can be removed.
      - name: Audit (all dependencies, reviewed allowlist)
        run: node scripts/audit-gate.cjs --level moderate --allowlist audit-allowlist.json

      - name: Full report (informational)
        if: always()
        run: npm audit || true
