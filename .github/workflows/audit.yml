name: Dependency audit

# Runs on every push and once a week. The weekly run is the point: a repository
# with no commits is not a repository with no vulnerabilities, and most advisories
# land against code that has not changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 09:00 Manila, Mondays (01:00 UTC).
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # This is the client people load in a browser, and it currently reports
      # zero advisories at any level - so the gate is set where it actually is
      # rather than somewhere looser it could drift down to unnoticed.
      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Full report (informational)
        if: always()
        run: npm audit || true
